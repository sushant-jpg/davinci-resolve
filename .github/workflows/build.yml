name: Linux build and media regression
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install build and media dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ qt6-base-dev qt6-multimedia-dev ffmpeg pulseaudio
      - name: Start a test audio sink
        run: |
          pulseaudio --start --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=sentinel_test
          pactl set-default-sink sentinel_test
      - run: cmake --preset debug
      - run: cmake --build --preset debug -j 2
      - run: ctest --preset debug
